name: Update NSE Sheet
on:
  schedule:
    - cron: '*/15 3-10 * * 1-5'
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install -r requirements.txt
      - run: python nse_fetch.py
        env:
          GOOGLE_CREDS: ${{ secrets.GOOGLE_CREDS }}
